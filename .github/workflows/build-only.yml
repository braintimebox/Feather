name: Build Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Compile Feather (iphoneos)
        run: |
          make iphoneos

      - name: Verify IPA produced
        run: |
          ls -la packages/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feather-ipa
          path: packages/*.ipa
          if-no-files-found: error
          retention-days: 7
